name: Appium Tests (GitHub Actions with Emulator)

on:
  push:
  workflow_dispatch:

jobs:
  appium-emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Allow time for emulator boot and tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true  # Enable Git LFS to fetch default_boot.zip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Verify Node.js Version
        run: |
          node -v
          npm -v

      - name: Install NPM Dependencies
        run: npm ci

      - name: List all files in current directory
        run: ls -alR

      - name: Enable KVM for Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD Snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-default-boot  # Cache key for default_boot snapshot

      - name: Restore Custom Snapshot
        run: |
          mkdir -p ~/.android/avd/test_avd.avd/snapshots
          unzip emulator_snapshots/default_boot.zip -d ~/.android/avd/test_avd.avd/snapshots/default_boot

      - name: Debug SDK Packages (if cache miss)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager --list | grep system-images || true
        continue-on-error: true

      - name: Create AVD (if not cached)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          avd-name: test_avd
          api-level: 35  # Android 15 (API 35)
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disk-size: 2048M
          force-avd-creation: true  # Ensure AVD is created
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD for caching."

      - name: Run Appium Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 60  # 60s for emulator shutdown
        with:
          avd-name: test_avd
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disk-size: 2048M
          force-avd-creation: false
          emulator-options: -snapshot default_boot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -e  # Exit on any error

            # Install Appium
            npm install -g appium@2.6.0

            # Verify UiAutomator2 driver
            appium driver list --installed

            # Start Appium server
            appium --relaxed-security &
            sleep 10

            # Wait for emulator boot
            adb wait-for-device
            adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done;'

            # Verify emulator
            adb devices >> emulator_logcat.txt

            # Install APK (if not in snapshot)
            adb install app.apk

            # Log current activity
            adb shell dumpsys window | grep mCurrentFocus >> emulator_logcat.txt || true

            # Run WDIO tests
            npx wdio run wdio.conf.ts | tee wdio_output.txt

            # Capture screenshot
            adb shell screencap /sdcard/screenshot.png || true
            adb pull /sdcard/screenshot.png ./screenshot.png || true

            # Collect logs
            adb logcat -d >> emulator_logcat.txt || true

            # Force kill emulator
            adb -s emulator-5554 emu kill || true

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            allure-results/
            emulator_logcat.txt
            wdio_output.txt
            screenshot.png