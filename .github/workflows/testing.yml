name: Appium Emulator CI (API 35 Google Play x86_64)

on:
  push:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Temporary envs per your request (MOVE TO SECRETS ASAP)
    env:
      AVD_NAME: api35-x86_64-play
      GOOGLE_EMAIL: "ashish.prasad@alvaria.com"
      GOOGLE_PASSWORD: "Goodsheep66$$"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm

      - name: Install Node deps (if present)
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm i; fi

      # Enable KVM for better emulator performance on ubuntu-latest
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator (API 35 / Google Play / x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          avd-name: ${{ env.AVD_NAME }}
          # allow snapshots by NOT passing -no-snapshot / -no-snapshot-save
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb wait-for-device

            # --- Android QoL ---
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            # Reduce package verification nags (best-effort)
            adb shell settings put global package_verifier_enable 0 || true
            adb shell settings put global verifier_verify_adb_installs 0 || true

            # --- Chrome: disable first-run & default-browser prompts ---
            adb shell 'printf "chrome --disable-fre --no-first-run --no-default-browser-check --disable-search-engine-choice-screen\n" > /data/local/tmp/chrome-command-line'
            adb shell am force-stop com.android.chrome || true
            adb shell pm clear com.android.chrome || true
            adb shell monkey -p com.android.chrome -c android.intent.category.LAUNCHER 1
            sleep 3
            adb shell am force-stop com.android.chrome || true

            # Sanity checks
            adb shell getprop ro.product.cpu.abi
            adb shell getprop ro.build.version.sdk

      # ---- Place your sign-in/test step here. Your code can read GOOGLE_EMAIL/GOOGLE_PASSWORD ----
      # Example scaffolding only (replace with your real command):
      - name: Run Appium tests (placeholder)
        env:
          GOOGLE_EMAIL: ${{ env.GOOGLE_EMAIL }}
          GOOGLE_PASSWORD: ${{ env.GOOGLE_PASSWORD }}
        run: |
          echo "Starting tests…"
          # Example: npm run e2e:signin
          # Your tests should use process.env.GOOGLE_EMAIL / GOOGLE_PASSWORD
          # and drive the Google sign-in flow (in Settings or inside your app/Chrome).
          echo "NOTE: Credentials are available in env; do NOT echo them."
