name: Appium Tests (GitHub Actions with Emulator)

on:
  push:
  workflow_dispatch:

jobs:
  appium-emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Increased for large snapshot download

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Verify Node.js Version
        run: |
          node -v
          npm -v

      - name: Install NPM Dependencies
        run: npm ci

      - name: Install Zip Tools
        run: sudo apt install unzip -y

      - name: Enable KVM for Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD Config
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-config

      - name: Download and Extract Snapshot
        run: |
          /bin/bash -c "
            set -euo pipefail
            curl -L -o snap_boot.zip 'https://emulatorsnapshots.s3.ap-south-1.amazonaws.com/snap_boot.zip?response-content-disposition=inline&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Security-Token=IQoJb3JpZ2luX2VjEDAaCmFwLXNvdXRoLTEiSDBGAiEA3ikuld9xQtYcps2K7A5IFMXD2tmPyVUTrZY2FVypqwgCIQC72vY0DOIFmKmA5CzqY%2Brfopp8hrXanKRhy5ZzXRXcjSrCAwiJ%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F8BEAMaDDQ1ODM5MTc2NzEyMSIMnQ9SGVebMfJmmE6MKpYD0L3z%2FM6IuBMpiNi9OVUnHObgUiHqYtCrxp%2B9tGKsvUvCVNDoWichdoMg2E6s2wbQcDEIeNX531y2hzxoFJu32Bu7SreXslFCe%2FNBPPr1eCZ5LSGIXH22%2BN7ETvTcHo6zbRXJ%2FWUjlFoz1sE2mSjYofmcERnLEas%2FyRn6OXzxSfripjKhIOooBeFQHPp6q9ZSokgZLLryRyezjhi%2FaFVKQWmCKcYM03RBu3Guiu1kaYMBmcuCAll8PL5Re0bRc2G5me%2F9F3kYbQEGjQI5vgbUukSMSbO5eC4RA9Dg%2BlCUcJz4c1je2pOXX62L7SUnvLHoUwNJWUI%2BpD7bBG7BrbHMdCeeXFIDzZHEZl0LaOBy5vvDC4YJSIqKhsysbq2eAiPuUa37CfNCiR2mYaqosXXKKTEj4nRhknhoHSzaOpBqVsXf%2BvvjTNRSWenvqGVyDEO%2BtJQiULJZbkeewBbLhg1FR76UiG9%2F5uD%2FdVeaAYlOtz2KR9N7yQDJ88tNyv%2Fe73BmxyC8l2nzPcEzOojbY%2BfS5%2BS1l2Q%2BODCtnbrFBjrdApPst2wklrDNLw6Y%2FVx81WY1ZhZSEZ1snA2Ra2ex1Mun5rOAJeaVwe5rAmNh4jIPKR27rx6SyXT0R36v7pSeZhMGRWyi0zskMTmt70jFciYquxTCCGZlZcVdIG%2BJORET4TBmlnt26JMaX6UFv40y1ZmiwysQa%2BzpTiQhXFdu0gG3Qsq0nI%2FVdqTkXiq72rnpSlSea9JNSQ%2BMug5CASDOPRYxUMbjS1cvUlcDDPQU5GVLf7qTSpd82jSZVJaGvmhhU5lnt%2Fv6uNGXUNrSbqp6oJ1eHSEC5YzrzbHouSid7vVX4noosKUoS1P%2FM9xNrvZnlKpCDkHoUK5T2Nvtduqe9CJS02tTEgRs9WJDFlLFyWBEfsCNtLFOE8xVYWTuBQDpbl3gNfRSlgOsZu4OKy9msfnDA3UGhIno0idgzpuV4mpvrCAlZ5Xqagwc3ZKIhgoh2N9DI%2BiuBerovmxl4Dk%3D&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=ASIAWVOSHJBITGDOAVNO%2F20250827%2Fap-south-1%2Fs3%2Faws4_request&X-Amz-Date=20250827T073933Z&X-Amz-Expires=36000&X-Amz-SignedHeaders=host&X-Amz-Signature=9bfb9214c1fee9e1398fc9ca7bc1185de0d5b45bfbc45bf3b7eb561fac1d4c0b'
            mkdir -p ~/.android/avd/test_avd.avd/snapshots
            unzip -q snap_boot.zip -d ~/.android/avd/test_avd.avd/snapshots
            rm -rf ~/.android/avd/test_avd.avd/snapshots/__MACOSX
            echo 'Snapshot extracted.'
            ls -l ~/.android/avd/test_avd.avd/snapshots/snap_2025-08-27_10-53-29 || echo 'Snapshot directory listing failed.'
            chmod -R u+rw ~/.android/avd/test_avd.avd/snapshots/snap_2025-08-27_10-53-29 || echo 'Failed to set snapshot permissions.'
            # Rename your custom snapshot to 'default_boot' so the emulator loads it by default
            if [ -d ~/.android/avd/test_avd.avd/snapshots/snap_2025-08-27_10-53-29 ]; then
              rm -rf ~/.android/avd/test_avd.avd/snapshots/default_boot || true
              mv ~/.android/avd/test_avd.avd/snapshots/snap_2025-08-27_10-53-29 ~/.android/avd/test_avd.avd/snapshots/default_boot
              echo 'Renamed snapshot to default_boot.'
            fi
            ls -l ~/.android/avd/test_avd.avd/snapshots/ > snapshot_dir.txt
          "

      - name: Pre-start ADB (helps emulator talk to daemon on 5037)
        run: |
          adb start-server
          adb devices || true

      - name: Debug SDK Packages (if cache miss)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager --list | grep system-images || true
        continue-on-error: true

      - name: Create AVD (if not cached)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          avd-name: test_avd
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disk-size: 2048M
          force-avd-creation: true
          # Prevent any snapshot load/save here so we don't see 'default_boot' warnings during this preparatory run
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: echo "Generated AVD config for caching."

      - name: Run Appium Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 90
        with:
          avd-name: test_avd
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disk-size: 2048M
          force-avd-creation: false
          # Load our renamed snapshot explicitly and don't save back over it
          emulator-options: -snapshot default_boot -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: |
            /bin/bash -c "
              set -euo pipefail
              adb start-server
              adb wait-for-device
              echo 'Waiting for sys.boot_completed...'
              adb shell 'while [[ \"\$(getprop sys.boot_completed)\" != \"1\" ]]; do sleep 1; done;'
              echo 'Device booted.'

              npm install -g appium@2.6.0
              appium driver list --installed
              appium --relaxed-security &
              sleep 10

              adb devices >> emulator_logcat.txt
              adb install app.apk

              mkdir -p screenshots logs
              adb shell dumpsys account > account_dump.txt || true

              npx wdio run wdio.conf.ts | tee wdio_output.txt &
              PID=\$!
              INTERVAL=5
              MAX_MIN=35
              ELAPSED=0
              while kill -0 \$PID 2>/dev/null; do
                sleep \${INTERVAL}m
                ELAPSED=\$((ELAPSED + INTERVAL))
                echo \"Test Elapsed: \${ELAPSED} minutes - Still running...\"
                if [ \$ELAPSED -ge \$MAX_MIN ]; then
                  echo \"Timeout: Failing after \${MAX_MIN} minutes.\"
                  kill -9 \$PID
                  exit 1
                fi
              done
              wait \$PID
              EXIT_CODE=\$?
              if [ \$EXIT_CODE -ne 0 ]; then
                echo \"Tests failed with code \$EXIT_CODE\"
                exit \$EXIT_CODE
              fi

              adb shell screencap /sdcard/snapshot.png || true
              adb pull /sdcard/snapshot.png ./snapshot.png || true
              adb logcat -d >> emulator_logcat.txt || true
              adb -s emulator-5554 emu kill || true
            "

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            allure-results/
            emulator_logcat.txt
            wdio_output.txt
            snapshot.png
            snapshot_dir.txt
            account_dump.txt
            screenshots/
            logs/
