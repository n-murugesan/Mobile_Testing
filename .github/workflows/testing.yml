name: Appium Tests (GitHub Actions with Emulator)

on:
  push:
  workflow_dispatch:

jobs:
  appium-emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Verify Node.js Version
        run: |
          node -v
          npm -v

      - name: Install NPM Dependencies
        run: npm ci

      - name: List all files in current directory
        run: ls -alR

      - name: Enable KVM for Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD Snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35 

      - name: Debug SDK Packages (if cache miss)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager --list | grep system-images || true
        continue-on-error: true

      - name: Create AVD Snapshot (if not cached)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35  
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disk-size: 2048M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Run Appium Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35  
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disk-size: 2048M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # Install Appium
            npm install -g appium@2.6.0

            # Verify UiAutomator2 driver is available
            appium driver list --installed

            # Start Appium server in background
            appium --relaxed-security &  # Relaxed for CI
            sleep 10  # Wait for Appium to start

            # Wait for emulator to be fully booted
            adb wait-for-device
            adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done;'

            # Install the APK
            adb install app.apk

            # Run WDIO tests
            npx wdio run wdio.conf.ts

            # Collect logs for debugging
            adb logcat -d > emulator_logcat.txt || true

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            allure-results/
            emulator_logcat.txt
