name: Appium Tests with Emulator

# Triggers for the workflow
on:
  push:
  workflow_dispatch:

jobs:
  appium-emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      # Verify Node.js and npm versions
      - name: Verify Node.js Version
        run: |
          node -v
          npm -v

      # Install project dependencies
      - name: Install NPM Dependencies
        run: npm ci

      # Enable KVM for hardware acceleration
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Cache AVD snapshot to speed up future runs
      - name: Cache AVD Snapshot
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35

      # Debug SDK packages if cache miss
      - name: Debug SDK Packages
        if: steps.avd-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager --list | grep system-images || true
        continue-on-error: true

      # Download and extract AVD snapshot
      - name: Download and Extract Snapshot
        run: |
          curl -L -o snap_2025-08-27_10-53-29.zip "https://emulatorsnapshots.s3.ap-south-1.amazonaws.com/snap_2025-08-27_10-53-29.zip?response-content-disposition=inline&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Security-Token=IQoJb3JpZ2luX2VjEC8aCmFwLXNvdXRoLTEiRjBEAiAqGa0SoWStWTXMwdTaJeZg6bBcb8Vz54skiLy8DusOSgIgNBAVUa%2FeigoxM6eODKQMgvqlUlb1lLvzjefUIFKJiA4qwgMIiP%2F%2F%2F%2F%2F%2F%2F%2F%2F%2FARADGgw0NTgzOTE3NjcxMjEiDGl%2BCkzcWiWe3WxlkSqWA6%2Fahpw73uHQJw2th0w7TPF%2Bew5xr3FZHYHzO0cTIuwEEip%2F5GQHec7CmPpQTuu%2FwKewXzRmUjAInMj8ctbO1Us%2FVgm9q16F9M0HjGPYiE5uZHRWNNC7ImMX4PiWX2%2BLBcpSchGPO2MNUVts648gJg%2BH%2BRUzD3n0D14wrkn%2BqM%2B5eoGo1lmg6xS%2By2xzeM%2BH6nnD3o1d10o%2Bg6pqb8uXsned7RBs3wzkm1vGc3zkb6UbwroED9a5LodWb00nnzb%2BafK1h0MVihlI6TLluoqAqIx8dmwry%2FOlG4kSiqKQxBi3CYDbZQKwz2%2FaF7YYlqlyQ98L8Kln90294l7sDwuZhux93gxlizg8dyR8yvrLh1nFQC6Y%2Bw6o9jnzwYN1j%2Fk%2FMzU0SADRMVcmRqjGCdgWhEuoUFAUQX6yaKlJg9z42bkV%2FCWNl2WH6FtzexS8qXgPyTuwRF98aQGjXhDHbOLPKxf80rc9qJX3O7LVzQGPO1K8AD6PQ2%2BmsY7KtmlDItIps9OkvffftW4u5WNlBtbg8h3PulyRa3AwrZ26xQY63wICMIimWVaWvNikAe6DKCBuknpmycQliDVNGKZ1bAyQZPG1on38waEg3gbf9jsg0WUMU2M9ZNHO2nTlFhdkAyc1gcVV8dXQTdBDXAvCNoaZChgfg0BP%2FFZ1jf1d%2BgLEPJsT63Hfbx40LEZLexarAtHLjkxzTr2RBcyX6UQs4fZ8fbG50hU0FRlVB1OqpNJD3WCHg6ncN5YLUyW2QJAr4TtArliaoLKzNOZS2g%2Fk6lPCyL5%2FSxeqo0lCD1ssc2Ofpi7psO62bf1SAfNS5nDdKzwGhmuuGWks1unGxl20gvKTnTiobxT6CcPyua84z1aA40Wz80U2XZ%2BP6ikhwwodmbEuly0y0Tj%2B7h1SrX1s7ha4gHiQOdXJft5KrLxEW5479tSEfb8K0WYVfVL6Qh4AnxVncJ84S2c8vAWgv%2Bp53y7pwwLr5WCg7dl9Gfukw9Y8sg78OW6xRc0LZMTBtBGMZ1k%3D&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=ASIAWVOSHJBI7T435BGM%2F20250827%2Fap-south-1%2Fs3%2Faws4_request&X-Amz-Date=20250827T070259Z&X-Amz-Expires=36000&X-Amz-SignedHeaders=host&X-Amz-Signature=9eb32f0ee48d19bf4d9c5e4746428fef1f79bfb5d504162e883ac51af33ca987"
          mkdir -p ~/.android/avd/test_avd.avd/snapshots
          unzip snap_2025-08-27_10-53-29.zip -d ~/.android/avd/test_avd.avd/snapshots

      # Create AVD snapshot if not cached
      - name: Create AVD Snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          avd-name: test_avd
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disk-size: 2048M
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      # Run Appium tests on emulator
      - name: Run Appium Tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 90
        with:
          avd-name: test_avd
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disk-size: 2048M
          force-avd-creation: false
          emulator-options: -snapshot snap_2025-08-27_10-53-29 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -e
            npm install -g appium@2.6.0
            appium driver list --installed
            appium --relaxed-security &
            sleep 10
            adb wait-for-device
            adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done;'
            adb devices >> emulator_logcat.txt
            adb install app.apk
            npx wdio run wdio.conf.ts | tee wdio_output.txt
            adb logcat -d >> emulator_logcat.txt || true

      # Upload test artifacts for debugging
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            allure-results/
            emulator_logcat.txt
            wdio_output.txt
