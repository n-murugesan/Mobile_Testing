name: Appium Emulator CI (API 35 Google Play x86_64)

on:
  push:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      AVD_NAME: api35-x86_64-play
      SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_AVD_HOME: /home/runner/.android/avd
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm

      - name: Install Node deps
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm i; fi

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install SDK packages & ensure AVD exists
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android" "$ANDROID_AVD_HOME"
          : > "$HOME/.android/repositories.cfg"

          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "platforms;android-35" "emulator" \
            "system-images;android-35;google_apis_playstore;x86_64"

          AVD_DIR="$ANDROID_AVD_HOME/${AVD_NAME}.avd"
          if [ ! -d "$AVD_DIR" ]; then
            echo "Creating AVD: $AVD_NAME"
            echo "no" | "$SDK_ROOT/cmdline-tools/latest/bin/avdmanager" create avd \
              --force -n "$AVD_NAME" \
              --package "system-images;android-35;google_apis_playstore;x86_64" \
              --abi "google_apis_playstore/x86_64"
            printf 'hw.cpu.ncore=3\n' >> "$AVD_DIR/config.ini"
          else
            echo "AVD already exists."
          fi

      - name: Run Appium Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          avd-name: ${{ env.AVD_NAME }}
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          ram-size: 2048M
          disk-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -ex
            adb wait-for-device
            until adb shell getprop sys.boot_completed 2>/dev/null | grep -q "1"; do sleep 1; done
            until adb shell dumpsys window 2>/dev/null | grep -q mCurrentFocus; do sleep 1; done

            # Disable setup wizards
            adb shell settings put global device_provisioned 1 || true
            adb shell settings put secure user_setup_complete 1 || true
            adb shell cmd package list packages com.google.android.setupwizard | grep -q com.google.android.setupwizard && adb shell pm disable-user --user 0 com.google.android.setupwizard || true
            adb shell cmd package list packages com.android.provision | grep -q com.android.provision && adb shell pm disable-user --user 0 com.android.provision || true
            adb shell cmd package list packages com.android.managedprovisioning | grep -q com.android.managedprovisioning && adb shell pm disable-user --user 0 com.android.managedprovisioning || true
            adb shell cmd package list packages com.android.onetimeinitializer | grep -q com.android.onetimeinitializer && adb shell pm disable-user --user 0 com.android.onetimeinitializer || true

            # Disable animations
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true
            adb shell settings put global package_verifier_enable 0 || true
            adb shell settings put global verifier_verify_adb_installs 0 || true

            echo "[SETUP] Pre-seeding Chrome with flags..."
            adb shell 'echo "chrome --disable-fre --no-first-run --no-default-browser-check --disable-search-engine-choice-screen --disable-site-isolation-trials" > /data/local/tmp/chrome-command-line'
            adb shell am force-stop com.android.chrome || true
            adb shell pm clear com.android.chrome || true

            echo "[SETUP] Launching Chrome once..."
            adb shell monkey -p com.android.chrome -c android.intent.category.LAUNCHER 1 || true
            adb shell am force-stop com.android.chrome || true

            # Start Appium
            npm i -g appium@2.6.0
            appium --relaxed-security > appium.log 2>&1 &
            APP_PID=$!
            sleep 8

            # Install app and run tests
            if [ -f app.apk ]; then adb install -r app.apk || true; fi
            npx wdio run wdio.conf.ts | tee wdio_output.txt

            kill $APP_PID || true
            adb -s emulator-5554 emu kill || true

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            allure-results/
            emulator_logcat.txt
            wdio_output.txt
            screenshot.png
            appium.log
