name: Appium Tests (ARM64 Optimized)

on:
  push:
  workflow_dispatch:

jobs:
  appium-emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # ARM64 emulation takes longer

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip android-tools-adb qemu-user-static

      # Note: KVM doesn't help with ARM64 emulation on x86_64, but we'll keep it for completeness
      - name: Enable KVM for Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create ARM64 AVD
        run: |
          # Set environment variables
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator
          
          # Debug environment
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "PATH: $PATH"
          
          # Accept licenses
          yes | sdkmanager --licenses || true
          
          # Install necessary packages for ARM64 Google Play
          echo "Installing Android packages..."
          sdkmanager "platforms;android-35" "system-images;android-35;google_apis_playstore;arm64-v8a" "emulator" "platform-tools" "build-tools;35.0.0"
          
          # Verify installation
          echo "Available system images:"
          sdkmanager --list | grep "system-images;android-35" || true
          
          # Create AVD with ARM64 Google Play
          echo "Creating ARM64 AVD..."
          echo no | avdmanager create avd \
            --force \
            --name test_avd \
            --package "system-images;android-35;google_apis_playstore;arm64-v8a" \
            --abi google_apis_playstore/arm64-v8a
          
          # Configure AVD for better ARM64 performance
          AVD_CONFIG_FILE="$HOME/.android/avd/test_avd.avd/config.ini"
          if [ -f "$AVD_CONFIG_FILE" ]; then
            echo "Configuring AVD for ARM64 optimization..."
            # Add optimizations for ARM64 emulation
            echo "hw.cpu.ncore=2" >> "$AVD_CONFIG_FILE"
            echo "hw.ramSize=2048" >> "$AVD_CONFIG_FILE"
            echo "vm.heapSize=256" >> "$AVD_CONFIG_FILE"
            echo "hw.gpu.enabled=yes" >> "$AVD_CONFIG_FILE"
            echo "hw.gpu.mode=swiftshader_indirect" >> "$AVD_CONFIG_FILE"
            
            echo "AVD configuration:"
            cat "$AVD_CONFIG_FILE"
          fi
          
          # Verify AVD creation
          echo "Available AVDs:"
          avdmanager list avd
          ls -la ~/.android/avd/ || true

      - name: Download and Setup Custom Snapshot
        run: |
          set -euo pipefail
          
          # Download snapshot
          echo "Downloading snapshot..."
          curl -L -o snap_boot.zip 'https://emulatorsnapshots.s3.ap-south-1.amazonaws.com/snap_boot.zip?response-content-disposition=inline&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Security-Token=IQoJb3JpZ2luX2VjEDAaCmFwLXNvdXRoLTEiSDBGAiEA3ikuld9xQtYcps2K7A5IFMXD2tmPyVUTrZY2FVypqwgCIQC72vY0DOIFmKmA5CzqY%2Brfopp8hrXanKRhy5ZzXRXcjSrCAwiJ%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F8BEAMaDDQ1ODM5MTc2NzEyMSIMnQ9SGVebMfJmmE6MKpYD0L3z%2FM6IuBMpiNi9OVUnHObgUiHqYtCrxp%2B9tGKsvUvCVNDoWichdoMg2E6s2wbQcDEIeNX531y2hzxoFJu32Bu7SreXslFCe%2FNBPPr1eCZ5LSGIXH22%2BN7ETvTcHo6zbRXJ%2FWUjlFoz1sE2mSjYofmcERnLEas%2FyRn6OXzxSfripjKhIOooBeFQHPp6q9ZSokgZLLryRyezjhi%2FaFVKQWmCKcYM03RBu3Guiu1kaYMBmcuCAll8PL5Re0bRc2G5me%2F9F3kYbQEGjQI5vgbUukSMSbO5eC4RA9Dg%2BlCUcJz4c1je2pOXX62L7SUnvLHoUwNJWUI%2BpD7bBG7BrbHMdCeeXFIDzZHEZl0LaOBy5vvDC4YJSIqKhsysbq2eAiPuUa37CfNCiR2mYaqosXXKKTEj4nRhknhoHSzaOpBqVsXf%2BvvjTNRSWenvqGVyDEO%2BtJQiULJZbkeewBbLhg1FR76UiG9%2F5uD%2FdVeaAYlOtz2KR9N7yQDJ88tNyv%2Fe73BmxyC8l2nzPcEzOojbY%2BfS5%2BS1l2Q%2BODCtnbrFBjrdApPst2wklrDNLw6Y%2FVx81WY1ZhZSEZ1snA2Ra2ex1Mun5rOAJeaVwe5rAmNh4jIPKR27rx6SyXT0R36v7pSeZhMGRWyi0zskMTmt70jFciYquxTCCGZlZcVdIG%2BJORET4TBmlnt26JMaX6UFv40y1ZmiwysQa%2BzpTiQhXFdu0gG3Qsq0nI%2FVdqTkXiq72rnpSlSea9JNSQ%2BMug5CASDOPRYxUMbjS1cvUlcDDPQU5GVLf7qTSpd82jSZVJaGvmhhU5lnt%2Fv6uNGXUNrSbqp6oJ1eHSEC5YzrzbHouSid7vVX4noosKUoS1P%2FM9xNrvZnlKpCDkHoUK5T2Nvtduqe9CJS02tTEgRs9WJDFlLFyWBEfsCNtLFOE8xVYWTuBQDpbl3gNfRSlgOsZu4OKy9msfnDA3UGhIno0idgzpuV4mpvrCAlZ5Xqagwc3ZKIhgoh2N9DI%2BiuBerovmxl4Dk%3D&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=ASIAWVOSHJBITGDOAVNO%2F20250827%2Fap-south-1%2Fs3%2Faws4_request&X-Amz-Date=20250827T073933Z&X-Amz-Expires=36000&X-Amz-SignedHeaders=host&X-Amz-Signature=9bfb9214c1fee9e1398fc9ca7bc1185de0d5b45bfbc45bf3b7eb561fac1d4c0b'
          
          # Extract snapshot
          echo "Extracting snapshot..."
          unzip -q snap_boot.zip
          
          # Setup snapshot directory structure
          AVD_DIR="$HOME/.android/avd/test_avd.avd"
          SNAPSHOTS_DIR="$AVD_DIR/snapshots"
          
          # Create snapshots directory
          mkdir -p "$SNAPSHOTS_DIR/default_boot"
          
          # Clean up any existing snapshots
          rm -rf "$SNAPSHOTS_DIR"/* || true
          mkdir -p "$SNAPSHOTS_DIR/default_boot"
          
          # Move snapshot contents
          if [ -d "snap_2025-08-27_10-53-29" ]; then
            echo "Moving snapshot files..."
            mv snap_2025-08-27_10-53-29/* "$SNAPSHOTS_DIR/default_boot/" || true
            rmdir snap_2025-08-27_10-53-29 || true
          fi
          
          # Clean up download
          rm -f snap_boot.zip
          rm -rf __MACOSX || true
          
          # Set permissions
          chmod -R 755 "$SNAPSHOTS_DIR" || true
          
          # Verify snapshot structure
          echo "Snapshot directory contents:"
          ls -la "$SNAPSHOTS_DIR/default_boot/" || echo "Snapshot directory listing failed"
          
          # Check if essential snapshot files exist
          if [ -f "$SNAPSHOTS_DIR/default_boot/ram.bin" ] && [ -f "$SNAPSHOTS_DIR/default_boot/snapshot.pb" ]; then
            echo "✓ Essential snapshot files found"
          else
            echo "⚠ Warning: Essential snapshot files may be missing"
          fi

      - name: Start ARM64 Emulator
        run: |
          set -euo pipefail
          
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator
          
          # Start ADB server
          adb start-server
          
          # Kill any existing emulators
          adb devices | grep emulator | cut -f1 | while read line; do adb -s $line emu kill; done || true
          
          # Verify AVD exists
          if [ ! -f ~/.android/avd/test_avd.ini ]; then
            echo "ERROR: test_avd.ini not found!"
            ls -la ~/.android/avd/ || true
            exit 1
          fi
          
          # Start emulator with ARM64 optimizations and snapshot loading
          echo "Starting ARM64 emulator with snapshot..."
          
          # Try to load with snapshot first, fallback to cold boot if it fails
          emulator -avd test_avd \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -camera-back none \
            -camera-front none \
            -gpu swiftshader_indirect \
            -memory 2048 \
            -partition-size 2048 \
            -no-metrics \
            -qemu -smp 2 \
            -snapshot default_boot \
            -no-snapshot-save \
            -verbose 2>&1 &
          
          EMULATOR_PID=$!
          
          # Wait for emulator to start (ARM64 takes much longer)
          echo "Waiting for ARM64 emulator to start (this may take 5-10 minutes)..."
          
          # Check if emulator process is still running
          sleep 30
          if ! kill -0 $EMULATOR_PID 2>/dev/null; then
            echo "Emulator process died, trying cold boot without snapshot..."
            # Try without snapshot
            emulator -avd test_avd \
              -no-window \
              -no-audio \
              -no-boot-anim \
              -camera-back none \
              -camera-front none \
              -gpu swiftshader_indirect \
              -memory 2048 \
              -partition-size 2048 \
              -no-metrics \
              -qemu -smp 2 \
              -no-snapshot \
              -verbose 2>&1 &
            EMULATOR_PID=$!
          fi
          
          # Wait for device to be online with extended timeout
          timeout 900 adb wait-for-device || {
            echo "Timeout waiting for emulator device"
            kill -9 $EMULATOR_PID || true
            exit 1
          }
          
          # Wait for boot to complete with extended timeout
          echo "Waiting for boot to complete (ARM64 emulation is slow)..."
          timeout 900 bash -c 'until [[ $(adb shell getprop sys.boot_completed 2>/dev/null) == "1" ]]; do 
            echo "Boot progress: $(adb shell getprop sys.boot_completed 2>/dev/null || echo "not ready")"
            sleep 15
          done' || {
            echo "Timeout waiting for boot completion"
            adb shell getprop || true
            kill -9 $EMULATOR_PID || true
            exit 1
          }
          
          # Additional wait for system stabilization
          echo "Waiting for system to stabilize..."
          sleep 90
          
          echo "ARM64 emulator started successfully!"
          adb devices
          adb shell getprop ro.product.cpu.abi

      - name: Run Appium Tests
        run: |
          set -euo pipefail
          
          # Install Appium
          npm install -g appium@2.6.0
          
          # Check Appium drivers
          appium driver list --installed
          
          # Start Appium server
          echo "Starting Appium server..."
          appium --relaxed-security --log-level debug > appium.log 2>&1 &
          APPIUM_PID=$!
          sleep 20
          
          # Verify emulator is responsive
          echo "Verifying emulator responsiveness..."
          adb shell input keyevent KEYCODE_MENU || {
            echo "Emulator not responsive"
            exit 1
          }
          
          # Install APK
          echo "Installing APK..."
          adb install app.apk || {
            echo "Failed to install APK"
            exit 1
          }
          
          # Create directories for artifacts
          mkdir -p screenshots logs
          
          # Dump system info for debugging
          adb shell dumpsys account > account_dump.txt || true
          
          # Run tests with extended timeout for ARM64
          echo "Running WebDriver tests..."
          npx wdio run wdio.conf.ts | tee wdio_output.txt &
          TEST_PID=$!
          
          # Monitor test execution with timeout (longer for ARM64)
          INTERVAL=300  # 5 minutes
          MAX_MINUTES=50  # Extended for ARM64
          MAX_SECONDS=$((MAX_MINUTES * 60))
          ELAPSED=0
          
          while kill -0 $TEST_PID 2>/dev/null; do
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
            CURRENT_MINUTES=$((ELAPSED / 60))
            
            echo "Test Progress: ${CURRENT_MINUTES}/${MAX_MINUTES} minutes - Still running..."
            
            if [ $ELAPSED -ge $MAX_SECONDS ]; then
              echo "Test timeout reached (${MAX_MINUTES} minutes). Terminating..."
              kill -9 $TEST_PID || true
              kill -9 $APPIUM_PID || true
              exit 1
            fi
          done
          
          # Wait for test completion and get exit code
          wait $TEST_PID
          EXIT_CODE=$?
          
          # Clean up Appium
          kill -9 $APPIUM_PID || true
          
          # Capture final screenshot and logs
          adb shell screencap /sdcard/final_screenshot.png || true
          adb pull /sdcard/final_screenshot.png ./final_screenshot.png || true
          adb logcat -d > emulator_logcat.txt || true
          
          # Kill emulator
          adb emu kill || true
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Tests failed with code $EXIT_CODE"
            exit $EXIT_CODE
          fi
          
          echo "Tests completed successfully!"

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-arm64-${{ github.run_number }}
          path: |
            allure-results/
            emulator_logcat.txt
            appium.log
            wdio_output.txt
            final_screenshot.png
            account_dump.txt
            screenshots/
            logs/
